name: daisium-predict-nightly-compiler

# ============================================================================
#  Dynamic bootstrap: clones the private Daisium_Predict repo (CI_PAT_STRING),
#  PARSES its .github/workflows/ci.yml (scripts/daisium_ci_runner.py) and
#  EXECUTES every build step inside THIS repo's Actions space (our runners /
#  our minutes), then uploads the compiled results as workflow artifacts.
#
#  ci.yml is the single source of truth: job structure, matrix, toolchain
#  steps, build commands and upload names/paths are all read from it at run
#  time. Adding a target to ci.yml automatically appears here next run.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Daisium_Predict branch / tag to build"
        required: false
        default: "main"
      obfuscation_level:
        description: "OLLVM obfuscation level (1-3, 0=off) - forwarded to ci.yml"
        required: false
        default: "2"

env:
  DP_REPO: "mhbalthasar/Daisium_Predict"

permissions:
  contents: read
  actions: read

concurrency:
  group: daisium-predict-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: parse Daisium_Predict ci.yml
    runs-on: ubuntu-latest
    outputs:
      layer0: ${{ steps.plan.outputs.layer0 }}
      layer1: ${{ steps.plan.outputs.layer1 }}
      layer2: ${{ steps.plan.outputs.layer2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      - name: Ensure PyYAML
        run: python3 -c "import yaml" || python3 -m pip install --user --break-system-packages pyyaml

      - name: Plan
        id: plan
        run: >
          python3 scripts/daisium_ci_runner.py plan
          --ci dp/.github/workflows/ci.yml
          --ref "${{ inputs.ref }}"
          --input obfuscation_level="${{ inputs.obfuscation_level }}"
          --repo-dir dp

  build-l0:
    needs: plan
    if: needs.plan.outputs.layer0 != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layer0) }}
    env:
      UNIT_JSON: ${{ toJSON(matrix) }}
      DP_REPO_DIR: dp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      - name: Execute ci.yml steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/daisium_ci_runner.py exec-unit

      - name: Upload build outputs
        if: matrix.upload.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload.name }}
          path: ${{ matrix.upload.paths_joined }}
          retention-days: ${{ matrix.upload.retention != '' && matrix.upload.retention || '90' }}
          if-no-files-found: ${{ matrix.upload.if_no_files }}

  build-l1:
    needs: [plan, build-l0]
    if: always() && !failure() && !cancelled() && needs.plan.outputs.layer1 != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layer1) }}
    env:
      UNIT_JSON: ${{ toJSON(matrix) }}
      DP_REPO_DIR: dp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      - name: Execute ci.yml steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/daisium_ci_runner.py exec-unit

      - name: Upload build outputs
        if: matrix.upload.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload.name }}
          path: ${{ matrix.upload.paths_joined }}
          retention-days: ${{ matrix.upload.retention != '' && matrix.upload.retention || '90' }}
          if-no-files-found: ${{ matrix.upload.if_no_files }}

  build-l2:
    needs: [plan, build-l0, build-l1]
    if: always() && !failure() && !cancelled() && needs.plan.outputs.layer2 != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layer2) }}
    env:
      UNIT_JSON: ${{ toJSON(matrix) }}
      DP_REPO_DIR: dp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      - name: Execute ci.yml steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/daisium_ci_runner.py exec-unit

      - name: Upload build outputs
        if: matrix.upload.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload.name }}
          path: ${{ matrix.upload.paths_joined }}
          retention-days: ${{ matrix.upload.retention != '' && matrix.upload.retention || '90' }}
          if-no-files-found: ${{ matrix.upload.if_no_files }}
