name: daisium-predict-nightly-compiler

# ============================================================================
#  Dynamic bootstrap: clones the private Daisium_Predict repo (CI_PAT_STRING),
#  PARSES its .github/workflows/ci.yml (scripts/daisium_ci_runner.py) and
#  EXECUTES every build step inside THIS repo's Actions space (our runners /
#  our minutes), then uploads the compiled results as workflow artifacts.
#
#  ci.yml is the single source of truth: job structure, matrix, toolchain
#  steps, build commands and upload names/paths are all read from it at run
#  time. Adding a target to ci.yml automatically appears here next run.
#  ci.yml's `actions/cache` steps are read the same way: `plan` forwards
#  path/key/step-id per unit, this workflow restores them with the real
#  actions/cache@v4, and exec-unit skips the steps gated on a cache hit.
#
#  upload_backend=s3 swaps the transport for build outputs only: the same trees
#  go to s3://$TIGRIS_BUCKET/<DP_REPO name>/build-s3/<run>/<attempt>/<name>/ and
#  no artifact is ever created. Nothing about what gets built changes. The
#  default (artifacts) leaves every step byte-identical to before the input
#  existed - the S3 steps are gated off and the artifact step only gains a
#  condition that is true in that mode.
#  Motivation: the Actions artifact quota is account-wide and cross-repo, so
#  clearing it from one repo does not necessarily free a round for another.
#  Needs four repo secrets: TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY /
#  TIGRIS_BUCKET / TIGRIS_S3_URL. Objects do not expire on their own: put a
#  lifecycle rule on the build-s3/ prefix or the quota problem just moves.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Daisium_Predict branch / tag to build"
        required: false
        default: "main"
      obfuscation_level:
        description: "OLLVM obfuscation level (1-3, 0=off) - forwarded to ci.yml"
        required: false
        default: "2"
      upload_backend:
        description: "artifacts = Actions artifacts (default); s3 = Tigris S3, no artifacts"
        required: false
        default: "artifacts"
        type: choice
        options:
          - artifacts
          - s3

env:
  DP_REPO: "mhbalthasar/Daisium_Predict"

permissions:
  contents: read
  actions: read

concurrency:
  group: daisium-predict-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: parse Daisium_Predict ci.yml
    runs-on: ubuntu-latest
    outputs:
      layer0: ${{ steps.plan.outputs.layer0 }}
      layer1: ${{ steps.plan.outputs.layer1 }}
      layer2: ${{ steps.plan.outputs.layer2 }}
      # Empty in artifacts mode. Carried as a plan output rather than workflow env
      # so the target repo name is derived once from DP_REPO instead of being
      # repeated in three jobs.
      s3_prefix: ${{ steps.s3-prefix.outputs.s3_prefix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      - name: Ensure PyYAML
        run: python3 -c "import yaml" || python3 -m pip install --user --break-system-packages pyyaml

      - name: Plan
        id: plan
        run: >
          python3 scripts/daisium_ci_runner.py plan
          --ci dp/.github/workflows/ci.yml
          --ref "${{ inputs.ref }}"
          --input obfuscation_level="${{ inputs.obfuscation_level }}"
          --repo-dir dp

      # First path segment is the *target* repo name, not this repo's: the
      # objects belong to the Daisium_Predict project logically, and NightlyCompiler
      # is only where the build happens. Matches the libOpenCyan convention of
      # namespacing a shared bucket by repo name, which preserves its case.
      - name: S3 prefix
        id: s3-prefix
        env:
          BACKEND: ${{ inputs.upload_backend }}
          REPO: ${{ env.DP_REPO }}
        run: |
          if [ "$BACKEND" = "s3" ]; then
            # run + attempt scoped: re-running a run never overwrites the last
            # attempt, so the two rounds can still be compared side by side.
            echo "s3_prefix=${REPO#*/}/build-s3/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            echo "s3_prefix=" >> "$GITHUB_OUTPUT"
          fi

  build-l0:
    needs: plan
    if: needs.plan.outputs.layer0 != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layer0) }}
    env:
      UNIT_JSON: ${{ toJSON(matrix) }}
      DP_REPO_DIR: dp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      # ci.yml's own `actions/cache` steps are restored here with the real
      # action (blob I/O / chunking / eviction stay upstream). The runner then
      # skips whatever ci.yml gated behind `cache-hit != 'true'`.
      - name: Restore ci.yml cache
        id: dp-cache
        if: matrix.cache.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache.paths_joined }}
          key: ${{ matrix.cache.key }}
          restore-keys: ${{ matrix.cache.restore_keys }}

      - name: Execute ci.yml steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DP_CACHE_STEP_ID: ${{ matrix.cache.step_id }}
          DP_CACHE_HIT: ${{ steps.dp-cache.outputs.cache-hit }}
          # Empty in artifacts mode, so exec-unit keeps taking the original
          # artifacts REST path unchanged; non-empty redirects the cross-job
          # download to the same run's S3 prefixes.
          DP_S3_PREFIX: ${{ needs.plan.outputs.s3_prefix }}
          BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          S3_URL: ${{ secrets.TIGRIS_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: python3 scripts/daisium_ci_runner.py exec-unit

      - name: Upload build outputs
        if: ${{ matrix.upload.name != '' && needs.plan.outputs.s3_prefix == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload.name }}
          path: ${{ matrix.upload.paths_joined }}
          retention-days: ${{ matrix.upload.retention != '' && matrix.upload.retention || '90' }}
          if-no-files-found: ${{ matrix.upload.if_no_files }}

      - name: Upload build outputs -> S3
        if: ${{ matrix.upload.name != '' && needs.plan.outputs.s3_prefix != '' }}
        shell: bash
        env:
          DP_S3_PREFIX: ${{ needs.plan.outputs.s3_prefix }}
          BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          S3_URL: ${{ secrets.TIGRIS_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          NAME: ${{ matrix.upload.name }}
          PATHS: ${{ matrix.upload.paths_joined }}
          IF_NO_FILES: ${{ matrix.upload.if_no_files }}
        run: bash scripts/s3_upload.sh

  build-l1:
    needs: [plan, build-l0]
    if: always() && !failure() && !cancelled() && needs.plan.outputs.layer1 != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layer1) }}
    env:
      UNIT_JSON: ${{ toJSON(matrix) }}
      DP_REPO_DIR: dp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      # ci.yml's own `actions/cache` steps are restored here with the real
      # action (blob I/O / chunking / eviction stay upstream). The runner then
      # skips whatever ci.yml gated behind `cache-hit != 'true'`.
      - name: Restore ci.yml cache
        id: dp-cache
        if: matrix.cache.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache.paths_joined }}
          key: ${{ matrix.cache.key }}
          restore-keys: ${{ matrix.cache.restore_keys }}

      - name: Execute ci.yml steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DP_CACHE_STEP_ID: ${{ matrix.cache.step_id }}
          DP_CACHE_HIT: ${{ steps.dp-cache.outputs.cache-hit }}
          # Empty in artifacts mode, so exec-unit keeps taking the original
          # artifacts REST path unchanged; non-empty redirects the cross-job
          # download to the same run's S3 prefixes.
          DP_S3_PREFIX: ${{ needs.plan.outputs.s3_prefix }}
          BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          S3_URL: ${{ secrets.TIGRIS_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: python3 scripts/daisium_ci_runner.py exec-unit

      - name: Upload build outputs
        if: ${{ matrix.upload.name != '' && needs.plan.outputs.s3_prefix == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload.name }}
          path: ${{ matrix.upload.paths_joined }}
          retention-days: ${{ matrix.upload.retention != '' && matrix.upload.retention || '90' }}
          if-no-files-found: ${{ matrix.upload.if_no_files }}

      - name: Upload build outputs -> S3
        if: ${{ matrix.upload.name != '' && needs.plan.outputs.s3_prefix != '' }}
        shell: bash
        env:
          DP_S3_PREFIX: ${{ needs.plan.outputs.s3_prefix }}
          BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          S3_URL: ${{ secrets.TIGRIS_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          NAME: ${{ matrix.upload.name }}
          PATHS: ${{ matrix.upload.paths_joined }}
          IF_NO_FILES: ${{ matrix.upload.if_no_files }}
        run: bash scripts/s3_upload.sh

  build-l2:
    needs: [plan, build-l0, build-l1]
    if: always() && !failure() && !cancelled() && needs.plan.outputs.layer2 != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.layer2) }}
    env:
      UNIT_JSON: ${{ toJSON(matrix) }}
      DP_REPO_DIR: dp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DP_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_PAT_STRING }}
          path: dp

      # ci.yml's own `actions/cache` steps are restored here with the real
      # action (blob I/O / chunking / eviction stay upstream). The runner then
      # skips whatever ci.yml gated behind `cache-hit != 'true'`.
      - name: Restore ci.yml cache
        id: dp-cache
        if: matrix.cache.key != ''
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache.paths_joined }}
          key: ${{ matrix.cache.key }}
          restore-keys: ${{ matrix.cache.restore_keys }}

      - name: Execute ci.yml steps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DP_CACHE_STEP_ID: ${{ matrix.cache.step_id }}
          DP_CACHE_HIT: ${{ steps.dp-cache.outputs.cache-hit }}
          # Empty in artifacts mode, so exec-unit keeps taking the original
          # artifacts REST path unchanged; non-empty redirects the cross-job
          # download to the same run's S3 prefixes.
          DP_S3_PREFIX: ${{ needs.plan.outputs.s3_prefix }}
          BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          S3_URL: ${{ secrets.TIGRIS_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: python3 scripts/daisium_ci_runner.py exec-unit

      - name: Upload build outputs
        if: ${{ matrix.upload.name != '' && needs.plan.outputs.s3_prefix == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload.name }}
          path: ${{ matrix.upload.paths_joined }}
          retention-days: ${{ matrix.upload.retention != '' && matrix.upload.retention || '90' }}
          if-no-files-found: ${{ matrix.upload.if_no_files }}

      - name: Upload build outputs -> S3
        if: ${{ matrix.upload.name != '' && needs.plan.outputs.s3_prefix != '' }}
        shell: bash
        env:
          DP_S3_PREFIX: ${{ needs.plan.outputs.s3_prefix }}
          BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          S3_URL: ${{ secrets.TIGRIS_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          NAME: ${{ matrix.upload.name }}
          PATHS: ${{ matrix.upload.paths_joined }}
          IF_NO_FILES: ${{ matrix.upload.if_no_files }}
        run: bash scripts/s3_upload.sh
